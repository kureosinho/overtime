plugins { id "com.android.application" }

android {
    namespace "fr.overtime.app"
    compileSdk 34
    defaultConfig {
        applicationId "fr.overtime.app"
        minSdk 29
        targetSdk 34
        versionCode((System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger())
        versionName "2.5." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
        ndk { abiFilters "arm64-v8a" }
    }
    signingConfigs {
        release {
            storeFile file("overtime.keystore")
            storePassword "overtime-app"
            keyAlias "overtime"
            keyPassword "overtime-app"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging { jniLibs { useLegacyPackaging true } }
}
