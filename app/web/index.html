<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overtime — Rocket League</title>
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="styles.css">
<script src="vendor/chart.umd.js"></script>
</head>
<body>
<!-- dégradé de la jauge de boost, partagé par toutes les jauges -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gBoost" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe24a"/><stop offset=".55" stop-color="#ff9a1f"/><stop offset="1" stop-color="#ff4f6d"/>
    </linearGradient>
  </defs>
</svg>
<header class="top">
  <a class="brand" href="#/">
    <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M7.5 23.5A11 11 0 1 1 24.5 23.5" fill="none" stroke="url(#gBoost)" stroke-width="4" stroke-linecap="round"/><path d="M16 16 L22 10" stroke="#eef0ff" stroke-width="2.5" stroke-linecap="round"/><circle cx="16" cy="16" r="2.6" fill="#eef0ff"/></svg>
    <span>Overtime<small>Rocket League</small></span>
  </a>
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="text" placeholder="Rechercher un joueur croisé…" autocomplete="off" aria-label="Rechercher un joueur">
    <kbd>Ctrl K</kbd>
    <div class="results" id="qres"></div>
  </div>
  <div class="status" id="status"></div>
</header>
<main id="view"></main>
<nav class="dock" id="dock" aria-label="Navigation">
  <a href="#/" data-r="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 18a8 8 0 1 1 16 0"/><path d="M12 18l4-5"/><circle cx="12" cy="18" r="1.4" fill="currentColor"/></svg>Accueil</a>
  <a href="#/games" data-r="games"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="5" rx="2"/><rect x="3" y="11" width="18" height="5" rx="2"/><path d="M3 20h18"/></svg>Games</a>
  <a href="#/analyse" data-r="analyse"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l8 5v8l-8 5-8-5V8z"/><path d="M12 8l4 2.5v3.5L12 17l-3-2.5V10z" fill="currentColor" opacity=".35"/></svg>Analyse</a>
  <a href="#/pro" data-r="pro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M9 20h6"/></svg>Pro</a>
  <a href="#/joueurs" data-r="joueurs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.2"/><path d="M3 20a6 6 0 0 1 12 0"/><circle cx="17" cy="9" r="2.6"/><path d="M16 14.2A5 5 0 0 1 21 19"/></svg>Joueurs</a>
  <a href="#/reglages" data-r="reglages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>Réglages</a>
</nav>
<script type="module" src="app.js"></script>
</body>
</html>
